# https://taskfile.dev/usage/
version: '3'
tasks:
  default: bun test ./test/*.test.ts

  # http://localhost:8787
  dev: bun run dev

  api: task openapi
  openapi: bunx wrangler dev src/openapi.ts
  # ok after v1.2.4+, not works on 1.2.3
  api-bun: bun run --hot src/openapi.ts

  ## deploy on cloudflare workers
  # https://hello-hono.shareup.workers.dev/
  dep: bun run deploy

  # https://developers.cloudflare.com/workers/wrangler/
  wrangler: bunx wrangler --help

  ## Bun specific websocket
  bun-ws: |
    bun run --hot src/bun/ws.tsx
    # http://localhost:3000
  bun-ws-client: |
    bun run --hot src/bun/ws-client.ts

  envd: bun run --hot src/env.ts

  gen-uuid: bun --print "crypto.randomUUID()"

  ## Rpc
  rpc: |
    bun run --hot src/bun/rpc.ts
    # http://localhost:3000
  rpc-client: |
    bun run src/bun/rpc-client.ts


  # brew install hey
  bench: |
    hey -n 5 -c 1 https://hello-hono.shareup.workers.dev/ping
  
  wstest: |
    curl -i -N -H "Connection: Upgrade" -H "Upgrade: websocket" -H "Host: localhost" -H "Origin: http://localhost" http://localhost:8787/ws

  
  # static files in public/hello.txt
  # https://hono.dev/docs/getting-started/cloudflare-workers#serve-static-files
  public-hello-txt: |
    open http://localhost:8787/hello.txt

  ## templates
  # Template to use (choices: "aws-lambda", "bun", "cloudflare-pages", "cloudflare-workers", "deno", "fastly", "lambda-edge", "netlify", "nextjs", "nodejs", "vercel", "x-basic")
  mk-tmpls: |
    # bun create hono --template bun --pm bun --install _local/tmpl-bun
    bun create hono --template cloudflare-pages --pm bun --install _local/tmpl-cf-pages
    bun create hono --template cloudflare-workers --pm bun --install _local/tmpl-cf-workers
    # this is honox basic
    bun create hono --template x-basic --pm bun --install _local/tmpl-x-basic

  setup: |
    bun add --dev @cloudflare/workers-types
    bun add -D @cloudflare/vitest-pool-workers
    bun add -D vitest
    un add -D @types/bun
